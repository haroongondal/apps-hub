plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.textocr'
version = '0.1.0'

android {
  namespace "expo.modules.textocr"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Apache-2.0, owner-approved (docs/pdf-editor/scan/SPEC.md section 2). JitPack only; both apps already list it in allprojects.repositories.
  implementation("cz.adaptech.tesseract4android:tesseract4android:4.9.0")
  testImplementation("junit:junit:4.13.2")
}

// tessdata_fast models (Apache-2.0), from tesseract-ocr/tessdata_fast at commit 87416418657359cb625c412a48b6e1d6d41c29bd.
// Fail the build if the bundled bytes change (a comment alone checks nothing). Update MODEL_SIZES in Recognizer.kt with them.
def modelSha256 = [
  eng: '7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2',
  ara: 'e3206d3dc87fd50c24a0fb9f01838615911d25168f4e64415244b67d2bb3e729',
  urd: '62e8250ce2a994106e313a82e26a516a39e2cf159d0ce3c5b5008387fd0d555f',
]
tasks.register('verifyTraineddata') {
  doLast {
    modelSha256.each { code, expected ->
      def f = file("src/main/assets/tessdata/${code}.traineddata")
      def sha = java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString()
      if (sha != expected) throw new GradleException("${code}.traineddata sha256 is ${sha}, not the approved ${expected}")
    }
  }
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn 'verifyTraineddata' }
