plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.textocr'
version = '0.1.0'

android {
  namespace "expo.modules.textocr"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Apache-2.0, owner-approved (docs/pdf-editor/scan/SPEC.md section 2). JitPack only; both apps already list it in allprojects.repositories.
  implementation("cz.adaptech.tesseract4android:tesseract4android:4.9.0")
  testImplementation("junit:junit:4.13.2")
}

// tessdata_fast eng.traineddata (Apache-2.0). Fail the build if the bundled bytes change (a comment alone checks nothing).
def engSha256 = '7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2'
tasks.register('verifyEngTraineddata') {
  doLast {
    def f = file('src/main/assets/tessdata/eng.traineddata')
    def sha = java.security.MessageDigest.getInstance('SHA-256').digest(f.bytes).encodeHex().toString()
    if (sha != engSha256) throw new GradleException("eng.traineddata sha256 is ${sha}, not the approved ${engSha256}")
  }
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn 'verifyEngTraineddata' }
