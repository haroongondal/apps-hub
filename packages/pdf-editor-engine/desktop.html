<!doctype html>
<html lang="en" data-brand="pdf">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Editor</title>
<link rel="stylesheet" href="../ui/web/tokens.css">
<link rel="stylesheet" href="../ui/web/base.css">
<style>
  body { font: var(--type-meta) var(--font-sans); }
  .ui-btn svg { width:18px; height:18px; flex:none; fill:none; stroke:currentColor; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; }

  header { position:sticky; top:0; z-index:10; flex-wrap:wrap; padding:6px 12px; background:var(--c-surface); border-bottom:1px solid var(--c-line); }
  header .ui-btn--ghost { font-weight:400; }
  .tools { display:flex; gap:2px; }
  .field { display:inline-flex; align-items:center; gap:var(--space-sm); min-height:36px; padding:0 var(--space-xs); color:var(--c-muted); }
  #color { width:28px; height:28px; padding:0; border:1px solid var(--c-line); border-radius:8px; background:none; cursor:pointer; }
  #color::-webkit-color-swatch-wrapper { padding:0; }
  #color::-webkit-color-swatch { border:none; border-radius:7px; }
  #size { width:64px; padding:0 var(--space-sm); font-variant-numeric:tabular-nums; }
  #name { margin-left:auto; padding:0 var(--space-sm); color:var(--c-muted); max-width:30ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  #pages { display:flex; flex-direction:column; align-items:center; gap:var(--space-xl); padding:var(--space-lg) var(--space-xl) 80px; }
  #empty { margin-top:10vh; width:340px; aspect-ratio:1 / 1.3; display:flex; flex-direction:column; justify-content:center; align-items:flex-start; gap:var(--space-md);
    padding:var(--space-xxl); background:var(--c-surface); border:1px dashed var(--c-line); border-radius:4px; position:relative; }
  #empty::after { content:''; position:absolute; top:-1px; right:-1px; width:36px; height:36px; background:linear-gradient(225deg, var(--c-bg) 50%, var(--c-raised) 50%); border-bottom-left-radius:4px; }
  #empty p { margin:0; }
  #empty .ui-btn { margin-top:var(--space-sm); }

  .slot { display:flex; flex-direction:column; gap:var(--space-xs); align-items:center; }
  /* contain: the rail stretches to the page width but never widens the slot itself */
  .pbar { align-self:stretch; contain:inline-size; display:flex; align-items:center; gap:2px; color:var(--c-muted); font:600 var(--type-caption) var(--font-sans); }
  .pnum { margin-right:auto; display:flex; align-items:center; gap:var(--space-sm); font-variant-numeric:tabular-nums; }
  .pnum::before { content:''; width:3px; height:14px; border-radius:2px; background:var(--c-line); }
  .slot[aria-current="page"] .pnum { color:var(--c-accent); }
  .slot[aria-current="page"] .pnum::before { background:var(--c-accent); }
  .pbar .ui-btn { color:var(--c-muted); }
  .pbar .ui-btn:hover:not(:disabled) { color:var(--c-text); }
  .pbar .ui-btn[title="Delete page"]:hover:not(:disabled) { color:var(--c-danger); }
  .pbar .ui-btn:disabled { opacity:.35; }

  .frame { position:relative; }
  .page { position:absolute; left:50%; top:50%; background:#fff; box-shadow:0 0 0 1px rgb(0 0 0 / .06), 0 2px 12px -4px rgb(0 0 0 / .25); }
  .page canvas { display:block; }
  .layer { position:absolute; inset:0; touch-action:none; }
  body[data-tool="text"] .layer { cursor:text; }
  body[data-tool="draw"] .layer, body[data-tool="highlight"] .layer, body[data-tool="whiteout"] .layer, body[data-tool="image"] .layer { cursor:crosshair; }
  .annot { position:absolute; }
  .annot.text { font-family:Helvetica, Arial, sans-serif; line-height:1.2; white-space:pre; min-width:1ch; outline:1px dashed transparent; }
  body[data-tool="text"] .annot.text { outline-color:#999; }
  .annot.draw { left:0; top:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
  .annot.draw polyline { pointer-events:stroke; }
  .annot.sel { outline:2px solid var(--c-accent) !important; }
  .annot.draw.sel polyline { filter:drop-shadow(0 0 2px var(--c-accent)); }
  body[data-tool="edittext"] .layer { cursor:text; }
  .tbox { position:absolute; white-space:pre; color:transparent; outline:1px solid transparent; }
  body[data-tool="edittext"] .tbox:hover { outline-color:var(--c-accent); }
  body[data-tool="edittext"] .tbox:hover:not(:focus, .edited) { background:var(--c-accent-soft); }
  .tbox:focus, .tbox.edited { color:var(--tb-ink, #000); background:var(--tb-bg, #fff); }
  .tbox:focus { outline:2px solid var(--c-accent); }
</style>
</head>
<body data-tool="select">
<header class="ui-toolbar">
  <button class="ui-btn ui-btn--ghost" id="openBtn" title="Open a PDF in place of the current one">Open</button>
  <button class="ui-btn ui-btn--ghost" id="mergeBtn" title="Append the pages of another PDF">Add PDF</button>
  <span class="ui-sep"></span>
  <div class="tools" role="group" aria-label="Tools">
    <button class="ui-btn ui-btn--ghost" data-tool="select" aria-pressed="true">Select</button>
    <button class="ui-btn ui-btn--ghost" data-tool="edittext">Edit text</button>
    <button class="ui-btn ui-btn--ghost" data-tool="text">Text</button>
    <button class="ui-btn ui-btn--ghost" data-tool="draw">Draw</button>
    <button class="ui-btn ui-btn--ghost" data-tool="highlight">Highlight</button>
    <button class="ui-btn ui-btn--ghost" data-tool="whiteout">White-out</button>
    <button class="ui-btn ui-btn--ghost" data-tool="image">Image</button>
  </div>
  <span class="ui-sep"></span>
  <label class="field">Colour <input id="color" type="color" value="#000000"></label>
  <label class="field">Size <input id="size" class="ui-input" type="number" min="1" max="200" value="14"></label>
  <span class="ui-sep"></span>
  <button class="ui-btn ui-btn--ghost ui-btn--icon" id="undo" title="Undo last add (Cmd/Ctrl+Z)" aria-label="Undo last add">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
  </button>
  <button class="ui-btn ui-btn--ghost ui-btn--icon" id="del" title="Delete selected (Del)" aria-label="Delete selected">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
  </button>
  <span id="name"></span>
  <button class="ui-btn ui-btn--primary" id="save" disabled>Save PDF</button>
</header>
<main id="pages">
  <section id="empty">
    <h1 class="ui-title">Open a PDF to start</h1>
    <p class="ui-muted">Edit its text, mark it up and rearrange its pages. The file never leaves this computer.</p>
    <button class="ui-btn ui-btn--primary ui-btn--lg" id="emptyOpen">Open a PDF</button>
    <p class="ui-meta">or drop one anywhere in this window</p>
  </section>
</main>
<input id="open" type="file" accept="application/pdf" hidden>
<input id="merge" type="file" accept="application/pdf" hidden>
<input id="imgpick" type="file" accept="image/*" hidden>

<script src="vendor/pdf.min.js"></script>
<!-- Loading the worker as a plain script makes PDF.js parse on the main thread, so the app works from file:// -->
<script src="vendor/pdf.worker.min.js"></script>
<script src="vendor/pdf-lib.min.js"></script>
<script src="textedit.js"></script>
<script src="core.js"></script>
<script>
// Desktop adapter: native dialogs and an <a download> save, exactly as before.
const desktopAdapter = {
  savePdf(bytes, name) {
    const link = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' })), download: name });
    link.click();
    setTimeout(() => URL.revokeObjectURL(link.href), 1000);
  },
  pickPdf(append) { document.querySelector(append ? '#merge' : '#open').click(); },
  pickImage() { document.querySelector('#imgpick').click(); },
  alert(msg) { alert(msg); },
  confirm(msg) { return confirm(msg); },
  emitDocumentLoaded() {},
  supports: { dragDrop: true, keyboard: true, fileInputs: true },
};
pdfEditorShell(desktopAdapter);
document.querySelector('#openBtn').onclick = () => desktopAdapter.pickPdf(false);
document.querySelector('#emptyOpen').onclick = () => desktopAdapter.pickPdf(false);
document.querySelector('#mergeBtn').onclick = () => desktopAdapter.pickPdf(true);
</script>

</body>
</html>
