packages:
  - "apps/*"
  - "apps/*/modules/*"
  - "packages/*"
  - "tools/*"

allowBuilds:
  workerd: true
  electron: true
  better-sqlite3: true
  canvas: false
  unrs-resolver: false
  esbuild: false
  electron-winstaller: false

patchedDependencies:
  decode-uri-component@0.2.2: patches/decode-uri-component@0.2.2.patch
  react-native-worklets@0.5.1: patches/react-native-worklets@0.5.1.patch

overrides:
  # One supports-color for the whole graph: as peers it resolved to 8.1.1 and 10.2.2, which
  # split react-native-worklets in two and broke the release build's Reanimated step.
  supports-color: 8.1.1
