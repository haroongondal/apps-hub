plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.inflowcore'
version = '0.1.0'

android {
  namespace "expo.modules.inflowcore"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation("androidx.biometric:biometric:1.1.0")
  // The version react-android already puts in the app, so the lock prompt adds no new artifact to the APK.
  implementation("androidx.appcompat:appcompat:1.7.0")
  // Encrypted notification store. BSD-style licence (Zetetic LLC), no network or analytics code.
  implementation("net.zetetic:sqlcipher-android:4.20.0@aar")
  implementation("androidx.sqlite:sqlite:2.5.0")
  // Gmail over IMAP. Eclipse Angus Mail (Jakarta Mail 2.1): EPL-2.0 OR GPL-2.0 with Classpath Exception OR BSD-3-Clause, no analytics code.
  implementation("org.eclipse.angus:angus-mail:2.0.3")
  // JSON element API for the AI request and reply (no compiler plugin). Apache-2.0, Kotlin team, no network or analytics code; Deputy ships the same version.
  implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1")
  // Read-only steps, sleep and heart rate from Health Connect (newest stable). Apache-2.0 (AOSP); pulls guava, protobuf-lite and coroutines, no Play Services or analytics.
  implementation("androidx.health.connect:connect-client:1.1.0")
  testImplementation("junit:junit:4.13.2")
}
