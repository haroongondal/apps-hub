plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.clipboardcore'
version = '0.1.0'

android {
  namespace "expo.modules.clipboardcore"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  testImplementation("junit:junit:4.13.2")
  // Test-only reader for the shared link fixtures; Apache-2.0, not in the APK.
  testImplementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1")
}
