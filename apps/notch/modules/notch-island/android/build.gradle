plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.notchisland'
version = '0.1.0'

android {
  namespace "expo.modules.notchisland"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Pinned to the version Deputy ships, so the APK keeps one copy.
  implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1")
  testImplementation("junit:junit:4.13.2")
}
