<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <title>YouTube embed</title>
    <style>
      body { margin: 0; background: #000; }
      #movie_player { position: relative; width: 640px; height: 360px; background: #000; }
      .html5-video-container, video { display: block; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="movie_player" class="html5-video-player" tabindex="-1" aria-label="YouTube Video Player">
      <div class="html5-video-container"><video class="video-stream html5-main-video"></video></div>
    </div>
    <script src="/yt/player.js"></script>
  </body>
</html>
