plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.opentunnelnative'
version = '0.1.0'

android {
  namespace "expo.modules.opentunnelnative"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // JVM tests: NativeTcpProbe counts a refused relay port as down.
  testImplementation("junit:junit:4.13.2")
}
