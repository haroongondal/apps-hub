plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.opentunnelnative'
version = '0.1.0'

android {
  namespace "expo.modules.opentunnelnative"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // JVM tests: NativeTcpProbe counts a refused relay port as down.
  testImplementation("junit:junit:4.13.2")
  // Test-only fixture reader (shared JSON fixtures in packages/); Apache-2.0, not in the APK.
  testImplementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1")
}
