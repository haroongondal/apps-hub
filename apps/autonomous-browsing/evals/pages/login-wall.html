<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Sign in — Acme Billing</title>
  </head>
  <body>
    <header class="site-chrome"><a href="/">Acme Billing</a></header>
    <main>
      <h1>Sign in to view your invoices</h1>
      <p>Your invoices, statements and payment methods are available once you sign in.</p>
      <form action="/session" method="post">
        <label for="user">Email</label>
        <input type="email" id="user" name="email" autocomplete="username" data-eval-target="login-user" />
        <label for="pass">Password</label>
        <input type="password" id="pass" name="password" autocomplete="current-password" data-eval-target="login-pass" />
        <button type="submit" data-eval-target="login-submit">Sign in</button>
      </form>
      <p><a href="/reset">Forgot your password?</a></p>
    </main>
  </body>
</html>
