plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.netlenscore'
version = '0.1.0'

android {
  namespace "expo.modules.netlenscore"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Hard OS rule tests (TCP RST ⇒ alive classifier) run on the Gradle JVM.
  testImplementation("junit:junit:4.13.2")
}
