plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.placereminders'
version = '0.1.0'

android {
  namespace "expo.modules.placereminders"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Platform LocationManager and NotificationManager only: no Play Services, no Firebase (FOSS rule).
  testImplementation("junit:junit:4.13.2")
}
