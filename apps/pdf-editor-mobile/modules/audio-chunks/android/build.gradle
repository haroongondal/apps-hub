plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.audiochunks'
version = '0.1.0'

android {
  namespace "expo.modules.audiochunks"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Platform MediaExtractor and MediaMuxer only: no ffmpeg, nothing proprietary (FOSS rule).
  testImplementation("junit:junit:4.13.2")
}
